# Application defaults.
# To change them without rebuilding, copy this file to
#   ~/.log-object-json/application.yml   or   ./application.yml
# or pass -Dlojson.<dotted.key>=value when launching the application
#   (e.g. -Dlojson.sync.delayMs=900).
# UI texts live in i18n/messages_<lang>.yml, not here.

sync:
  delayMs: 600             # ms after the last keystroke before re-instantiating

json:
  defaultName: Serialization.json   # used when the text does not come intact from a file
  extension: .json

dialects:
  resource: dialects.yml   # built-in dialects (inside the application): java, csharp, python, rust…
  file: dialects.yml       # your own file that adds/replaces dialects: a name (looked up in
                           # ~/.log-object-json/ and ./) or an absolute path

extractor:
  maxCandidates: 32        # max start points tried per line to find the object
  stackMb: 256             # parsing thread stack (MB): allows very deep nesting

editor:
  maxWrapLineLength: 20000 # line length above which Wrap is not allowed

search:
  delayMs: 250
  maxHistory: 25
  maxMarkAll: 2000         # max matches highlighted at once
  longLine: 20000          # in documents with lines longer than this…
  maxMarkLongLine: 150     # …highlight at most this many
  minWidth: 120
  maxWidth: 1200
  defaultWidth: 300

hoverMenu:                 # node actions menu (tree): translucent on hover, fixed on right click
  ghostOpacity: 0.35       # opacity while it follows the cursor (0..1)
  offsetX: 18              # position relative to the cursor while following it (px)
  offsetY: -6              #   (negative = above the cursor, so it does not cover the tooltip)
  fadeMs: 160              # duration of the translucent → opaque transition

problems:                  # problems list (JSON and log text)
  listHeight: 130          # initial height of the embedded list / floating box (px)
  floatingOpacity: 0.6     # opacity of the floating box while the cursor is not over it (0..1)

i18n:                      # UI languages (selector with flags at the top right)
  languages: en, es, fr, pt, de, it
  default: en              # also the fallback for texts missing in a language
  resource: i18n/messages_{lang}.yml
  flagResource: flags/{country}.png   # 64x48 PNG flags (public domain, from flagcdn.com)
  flags:                   # language → country of the flag shown in the selector
    en: gb
    es: es
    fr: fr
    pt: pt
    de: de
    it: it

compare:                   # comparison Pattern vs Sample (⇄ on the Root tab)
  highlightAlpha: 70       # opacity (0..255) of the highlights in the texts and the JSON
  colors:
    missing: "#C8281E"     # − in the Pattern, not in the Sample
    extra: "#1E8C46"       # + in the Sample, not in the Pattern
    type: "#1E5AC8"        # ≠ different type
    value: "#4F5D73"       # ~ different value (slate gray: visible, not mistaken for white or blue)
