plugins {
    id 'java'
    id 'groovy'          // Spock tests (Groovy)
    id 'application'
}

group = 'com.logobjectjson'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

application {
    mainClass = 'com.logobjectjson.Main'
}

repositories {
    mavenCentral()
}

// ── UI tests (need a display): separate source set ─────────────────────────────────────
sourceSets {
    uiTest {
        groovy.srcDir 'src/uiTest/groovy'
        resources.srcDir 'src/uiTest/resources'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    uiTestImplementation.extendsFrom testImplementation
    uiTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.17.2'   // application.yml
    implementation 'com.fifesoft:rsyntaxtextarea:3.4.0'

    testImplementation platform('org.spockframework:spock-bom:2.3-groovy-4.0')
    testImplementation 'org.spockframework:spock-core'
    testImplementation 'org.apache.groovy:groovy:4.0.21'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
tasks.withType(GroovyCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    maxHeapSize = '1g'          // the JVM defaults to 1/4 of RAM; stress tests need headroom
    systemProperty 'file.encoding', 'UTF-8'
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

// Headless tests: gradle test
test {
    systemProperty 'java.awt.headless', 'true'
}

// UI tests (Robot, real windows): gradle uiTest
tasks.register('uiTest', Test) {
    description = 'Functional tests of the Swing UI (require a display).'
    group = 'verification'
    testClassesDirs = sourceSets.uiTest.output.classesDirs
    classpath = sourceSets.uiTest.runtimeClasspath
    shouldRunAfter test
    maxParallelForks = 1
}

jar {
    manifest {
        attributes 'Main-Class': 'com.logobjectjson.Main'
    }
}
